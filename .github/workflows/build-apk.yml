name: Build APK dari ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di root repo. Upload zip proyek ke root repo."
            exit 1
          fi
          echo "Memakai: $ZIP"
          rm -rf _proj && mkdir _proj
          unzip -q "$ZIP" -d _proj
          SETTINGS=$(find _proj -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam zip."
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "PROJ_DIR=$PROJ_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJ_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Terima lisensi Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorWiFi-Turbo-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
